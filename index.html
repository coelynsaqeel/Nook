<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141715;
    --surface:#1D211E;
    --surface-2:#252A26;
    --stroke:#333A34;
    --ink:#F4F3EE;
    --ink-dim:#9AA39C;
    --ink-faint:#666E68;

    --urgent:#E85D3D;   --urgent-bg:#3A2620;
    --weekend:#E3B23C;  --weekend-bg:#37301B;
    --live:#4CD68A;

    --sports:#4CD68A;   --sports-bg:#1C332A;
    --social:#6FA3FF;   --social-bg:#1C2740;
    --civic:#C98EFA;    --civic-bg:#2C2140;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:#0A0B0A; font-family:'Inter',sans-serif; color:var(--ink);
    min-height:100vh; display:flex; justify-content:center;
  }
  h1,h2,h3,h4{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  input{ font-family:inherit; }

  #frame{
    width:100%; max-width:420px; min-height:100vh; background:var(--bg);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 0 1px #000;
  }
  @media(min-width:500px){ body{ padding:24px 0; } #frame{ min-height:calc(100vh - 48px); border-radius:36px; } }

  /* ---- app bar ---- */
  .appbar{ padding:14px 16px 10px; position:sticky; top:0; z-index:25; background:var(--bg); }
  .appbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:7px; }
  .brand .mark{ width:26px;height:26px;border-radius:8px; background:var(--urgent); display:flex;align-items:center;justify-content:center; font-size:0.85rem; }
  .brand span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; }
  .icon-btn{ position:relative; width:36px;height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--stroke); display:flex;align-items:center;justify-content:center; font-size:1rem; color:var(--ink); }
  .icon-btn .badge-dot{ position:absolute; top:5px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--urgent); border:1.5px solid var(--bg); }
  .appbar-actions{ display:flex; gap:8px; }

  .search-row{ margin-top:10px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:9px 12px; }
  .search-row input{ flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:0.88rem; }
  .search-row input::placeholder{ color:var(--ink-faint); }

  /* ---- radius control ---- */
  .radius-strip{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .radius-pill{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:7px 12px 7px 8px; font-size:0.8rem; font-weight:600; flex:0 0 auto; }
  .radius-pill .ring-ic{ width:16px;height:16px; border-radius:50%; border:2px solid var(--urgent); }
  .view-toggle{ display:flex; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:3px; margin-left:auto; }
  .view-toggle button{ background:none; border:none; padding:5px 10px; border-radius:16px; font-size:0.72rem; font-weight:600; color:var(--ink-faint); }
  .view-toggle button.active{ background:var(--urgent); color:#20140F; }

  .slider-panel{ display:none; margin-top:10px; background:var(--surface); border:1px solid var(--stroke); border-radius:14px; padding:12px 14px; }
  .slider-panel.open{ display:block; }
  .slider-panel .label-row{ display:flex; justify-content:space-between; font-size:0.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .slider-panel .value{ font-family:'IBM Plex Mono',monospace; color:var(--urgent); font-weight:600; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:4px;
    background:linear-gradient(to right, var(--urgent) 0%, var(--urgent) var(--pct,30%), var(--stroke) var(--pct,30%), var(--stroke) 100%); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px;height:18px;border-radius:50%; background:var(--bg); border:3px solid var(--urgent); cursor:pointer; margin-top:-1px; }

  .chips-row{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; }
  .chip-btn{ flex:0 0 auto; border:1px solid var(--stroke); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:0.76rem; font-weight:600; color:var(--ink-dim); }
  .chip-btn.active{ background:var(--ink); border-color:var(--ink); color:#101210; }

  /* ---- live-now rail ---- */
  .live-rail{ display:flex; gap:14px; overflow-x:auto; padding:14px 16px 4px; }
  .live-item{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px; width:60px; }
  .live-ring{ width:54px;height:54px;border-radius:50%; padding:2.5px; background:conic-gradient(var(--urgent), var(--weekend), var(--urgent)); display:flex; align-items:center; justify-content:center; }
  .live-ring .inner{ width:100%;height:100%; border-radius:50%; background:var(--bg); display:flex;align-items:center;justify-content:center; font-size:1.2rem; }
  .live-item span{ font-size:0.62rem; color:var(--ink-dim); text-align:center; line-height:1.15; }

  /* ---- scroll ---- */
  .scroll{ flex:1; overflow-y:auto; padding:8px 16px 100px; }
  .scroll::-webkit-scrollbar{ width:0; }

  .tier{ margin-top:18px; }
  .tier-head{ display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  .tier-dot{ width:7px;height:7px;border-radius:50%; }
  .tier-head h3{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.07em; font-weight:600; color:var(--ink-dim); }
  .tier-now .tier-dot{ background:var(--urgent); }
  .tier-weekend .tier-dot{ background:var(--weekend); }
  .tier-general .tier-dot{ background:var(--ink-faint); }
  .tier-empty{ font-size:0.8rem; color:var(--ink-faint); padding:2px; }

  /* ---- post card (social-feed style) ---- */
  .post{ background:var(--surface); border:1px solid var(--stroke); border-radius:16px; margin-bottom:12px; overflow:hidden; }
  .post-head{ display:flex; align-items:center; gap:9px; padding:12px 13px 0; }
  .avatar{ width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:0.72rem; font-weight:700; color:#0B0C0B; flex:0 0 auto;}
  .post-head .who{ flex:1; min-width:0; }
  .post-head .who .nm{ font-size:0.83rem; font-weight:600; display:flex; align-items:center; gap:4px; }
  .post-head .who .meta{ font-size:0.68rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .save-btn{ background:none; border:none; color:var(--ink-faint); font-size:1.1rem; padding:4px; }
  .save-btn.saved{ color:var(--weekend); }

  .post-body{ padding:10px 13px 0; }
  .post-title{ font-size:0.95rem; font-weight:600; line-height:1.35; }
  .tag-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .tag{ font-size:0.65rem; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.02em; }

  .cap-row{ display:flex; align-items:center; gap:8px; margin:10px 13px 0; }
  .cap-bar{ flex:1; height:4px; background:var(--stroke); border-radius:6px; overflow:hidden; }
  .cap-fill{ height:100%; border-radius:6px; }
  .cap-text{ font-size:0.65rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }

  .post-actions{ display:flex; gap:8px; padding:12px 13px 13px; }
  .btn{ border:none; border-radius:10px; padding:10px 14px; font-size:0.8rem; font-weight:700; flex:1; text-align:center; }
  .btn-primary{ background:var(--ink); color:#101210; }
  .btn-going{ background:var(--sports); color:#0B2318; }
  .btn-wait{ background:var(--weekend-bg); color:var(--weekend); }

  .discuss-post{ padding:12px 13px 14px; }

  /* ---- radar view ---- */
  .radar-wrap{ display:flex; justify-content:center; padding:20px 0 6px; }
  .radar-legend{ display:flex; justify-content:center; gap:14px; font-size:0.68rem; color:var(--ink-dim); margin-bottom:6px; }
  .radar-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:7px;height:7px;border-radius:50%; }

  /* ---- bottom nav ---- */
  .bottomnav{ position:absolute; bottom:0; left:0; right:0; height:66px; background:rgba(20,23,21,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--stroke); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--ink-faint); font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; position:relative; }
  .nav-btn .ic{ font-size:1.2rem; }
  .nav-btn.active{ color:var(--ink); }
  .nav-btn.active .ic{ filter:drop-shadow(0 0 8px rgba(232,93,61,0.5)); }
  .nav-fab{ background:var(--urgent); color:#20140F; width:46px;height:46px;border-radius:16px; display:flex;align-items:center;justify-content:center; font-size:1.3rem; margin-top:-14px; box-shadow:0 6px 16px rgba(232,93,61,0.4); }

  /* ---- notif panel ---- */
  .notif-panel{ position:absolute; top:60px; right:14px; width:280px; background:var(--surface-2); border:1px solid var(--stroke); border-radius:14px; z-index:45; box-shadow:0 20px 40px rgba(0,0,0,0.5); display:none; overflow:hidden; }
  .notif-panel.open{ display:block; }
  .notif-panel .np-head{ padding:12px 14px; font-size:0.78rem; font-weight:700; border-bottom:1px solid var(--stroke); }
  .notif-item{ padding:11px 14px; border-bottom:1px solid var(--stroke); font-size:0.78rem; color:var(--ink-dim); display:flex; gap:8px; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item.unread{ color:var(--ink); background:rgba(232,93,61,0.06); }
  .notif-item .n-dot{ width:6px;height:6px;border-radius:50%; background:var(--urgent); margin-top:5px; flex:0 0 auto; }
  .notif-item .n-dot.read{ background:transparent; }

  /* ---- overlay / drawer ---- */
  .overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.6); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .overlay.open{ display:flex; }
  .drawer{ background:var(--bg); width:100%; max-height:90%; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px 30px; animation:slideup 0.2s ease; border-top:1px solid var(--stroke); }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0.5; } to{ transform:translateY(0); opacity:1; } }
  .drawer-handle{ width:36px; height:4px; background:var(--stroke); border-radius:4px; margin:0 auto 14px; }
  .drawer-close{ position:absolute; top:14px; right:16px; background:var(--surface); border:1px solid var(--stroke); width:30px;height:30px; border-radius:50%; font-size:0.9rem; color:var(--ink); }

  .section-block{ margin:16px 0; }
  .section-block h4{ font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-bottom:8px; }
  .loc-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:8px 13px; font-size:0.8rem; }
  .loc-chip.locked{ color:var(--ink-dim); }
  .loc-chip.unlocked{ color:var(--sports); border-color:var(--sports-bg); background:var(--sports-bg); }

  .attendee-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--stroke); font-size:0.85rem; }
  .attendee-row:last-child{ border-bottom:none; }
  .badge-pill{ font-family:'IBM Plex Mono',monospace; font-size:0.6rem; padding:2px 7px; border-radius:10px; margin-left:auto; }
  .locked-note{ font-size:0.78rem; color:var(--ink-faint); }

  .chat-box{ background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:10px; }
  .chat-msg{ font-size:0.82rem; margin-bottom:8px; color:var(--ink-dim); }
  .chat-msg b{ color:var(--social); }
  .chat-input-row{ display:flex; gap:6px; margin-top:8px; }
  .chat-input-row input{ flex:1; border:1px solid var(--stroke); border-radius:20px; padding:9px 12px; font-size:0.82rem; background:var(--bg); color:var(--ink); outline:none; }
  .chat-input-row button{ background:var(--social); color:#0B1830; border:none; border-radius:20px; padding:9px 15px; font-size:0.82rem; font-weight:700; }
  .chat-locked{ text-align:center; padding:14px 10px; color:var(--ink-faint); font-size:0.8rem; }

  /* ---- chats tab ---- */
  .chat-row{ display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--stroke); }
  .chat-row .who{ flex:1; min-width:0; }
  .chat-row .nm{ font-size:0.88rem; font-weight:600; }
  .chat-row .preview{ font-size:0.76rem; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-row .status{ font-size:0.65rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:0.86rem; }
  .empty-state .em{ font-size:2rem; margin-bottom:10px; }

  /* ---- create screen ---- */
  .cat-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .cat-pick .opt{ border:1.5px solid var(--stroke); background:var(--surface); border-radius:14px; padding:16px 10px; text-align:center; }
  .cat-pick .opt.selected{ border-color:var(--ink); background:var(--surface-2); }
  .cat-pick .opt .em{ font-size:1.5rem; }
  .cat-pick .opt .nm{ font-size:0.8rem; font-weight:600; margin-top:6px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; font-family:'IBM Plex Mono',monospace; }
  .field input, .field textarea{ width:100%; border:1px solid var(--stroke); border-radius:10px; padding:10px 12px; font-size:0.9rem; background:var(--surface); color:var(--ink); outline:none; }
  .field textarea{ resize:vertical; min-height:56px; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; border:1px solid var(--stroke); background:var(--surface); border-radius:10px; padding:9px; font-size:0.78rem; font-weight:600; color:var(--ink-dim); }
  .seg button.active{ background:var(--ink); color:#101210; border-color:var(--ink); }

  .toast{ position:absolute; bottom:80px; left:16px; right:16px; background:var(--surface-2); border:1px solid var(--stroke); color:var(--ink); padding:12px 16px; border-radius:12px; font-size:0.84rem; text-align:center; z-index:50; opacity:0; transform:translateY(10px); transition:all 0.25s ease; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---- profile ---- */
  .profile-head{ text-align:center; padding:16px 0 18px; }
  .profile-avatar{ width:62px;height:62px;border-radius:50%; background:var(--sports); color:#0B2318; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:700; margin:0 auto 10px; }
  .stat-row{ display:flex; gap:10px; margin-top:14px; }
  .stat-card{ flex:1; background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:12px; text-align:center; }
  .stat-card .num{ font-family:'Space Grotesk',sans-serif; font-size:1.25rem; font-weight:700; }
  .stat-card .lbl{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:2px; }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .earned-badge{ background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:6px 12px; font-size:0.74rem; display:flex; align-items:center; gap:5px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--stroke); font-size:0.86rem; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .r{ color:var(--ink-faint); font-size:0.78rem; }
</style>
</head>

    { id:8, title:'Lost cat — grey tabby, green collar, answers to Biscuit', category:'civic', emoji:'💬', tier:'general', startLabel:null, distanceKm:0.4, capacity:null, going:0, waitlist:0, saved:false,
      host:{name:'Renee P.', verified:true}, locationType:'public', locationName:null, userRsvp:'none', discussion:true, replies:1, attendees:[], messages:[] },
  ]
};

/* ============================= HELPERS ============================= */
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 1700); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarColor(name){ const colors=['var(--sports)','var(--social)','var(--civic)','var(--weekend)','var(--urgent)']; let h=0; for(const c of name) h+=c.charCodeAt(0); return colors[h % colors.length]; }
function unreadCount(){ return state.notifications.filter(n=>!n.read).length; }

function filteredEvents(){
  return state.events.filter(e=>{
    if(e.distanceKm > state.radius) return false;
    if(state.category!=='all' && e.category!==state.category) return false;
    if(state.searchQuery && !e.title.toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
    return true;
  });
}
function eventsByTier(list, tier){ return list.filter(e=>e.tier===tier); }

/* ============================= ACTIONS ============================= */
function setRadius(v){ state.radius = parseFloat(v); render(); }
function toggleSlider(){ state.sliderOpen = !state.sliderOpen; render(); }
function setCategory(c){ state.category = c; render(); }
function setRadiusView(v){ state.radiusView = v; render(); }
function toggleSearch(){ state.searchOpen = !state.searchOpen; if(!state.searchOpen) state.searchQuery=''; render(); if(state.searchOpen) setTimeout(()=>document.getElementById('searchInput')?.focus(),0); }
function setSearch(v){ state.searchQuery = v; render(); }
function toggleNotif(){ state.notifOpen = !state.notifOpen; if(state.notifOpen) state.notifications.forEach(n=>n.read=true); render(); }
function switchScreen(s){ state.screen = s; state.selectedEventId=null; state.notifOpen=false; render(); }
function openEvent(id){ state.selectedEventId = id; state.notifOpen=false; render(); }
function closeEvent(){ state.selectedEventId = null; render(); }
function toggleSave(id, ev){ if(ev) ev.stopPropagation(); const e = state.events.find(x=>x.id===id); e.saved = !e.saved; render(); }

function toggleRsvp(id){
  const ev = state.events.find(e=>e.id===id);
  if(!ev) return;
  if(ev.userRsvp === 'none'){
    if(ev.capacity!==null && ev.going>=ev.capacity){
      ev.waitlist += 1; ev.userRsvp = 'waitlist';
      showToast("You're #" + ev.waitlist + " on the waitlist");
    } else {
      ev.going += 1; ev.userRsvp = 'going'; state.user.going += 1;
      showToast("You're in — check the Chats tab");
    }
  } else if(ev.userRsvp === 'going'){
    ev.going -= 1; ev.userRsvp = 'none'; state.user.going -= 1;
    showToast('RSVP cancelled');
  } else if(ev.userRsvp === 'waitlist'){
    ev.waitlist -= 1; ev.userRsvp = 'none';
    showToast('Left the waitlist');
  }
  render();
}

function sendChat(id){
  const ev = state.events.find(e=>e.id===id);
  const input = document.getElementById('chatInput');
  if(!input || !input.value.trim()) return;
  ev.messages.push({from: state.user.name, text: input.value.trim()});
  input.value=''; render();
  setTimeout(()=>{ const box=document.getElementById('chatScroll'); if(box) box.scrollTop = box.scrollHeight; },0);
}

function pickCreateCategory(cat){ state.createStep.category = cat; render(); }
function setCreateField(field, val){ state.createStep[field] = val; render(); }
function submitCreate(){
  const cs = state.createStep;
  if(!cs.category || !cs.title.trim()){ showToast('Add a category and title first'); return; }
  const tierMap = {'today-2h':'now','today-6h':'now','sat':'weekend','sun':'weekend'};
  const labelMap = {'today-2h':'Starts in 2h','today-6h':'Starts in 6h','sat':'Sat · time TBD','sun':'Sun · time TBD'};
  const emojiMap = {sports:'🏃', social:'🎉', civic:'📣'};
  const newEvent = {
    id: Date.now(), title: cs.title, category: cs.category, emoji: emojiMap[cs.category],
    tier: tierMap[cs.when] || 'now', startLabel: labelMap[cs.when], distanceKm: 0.3,
    capacity: cs.capacityType==='unlimited' ? null : parseInt(cs.capacity)||8,
    going: 1, waitlist: 0, saved:false, live: tierMap[cs.when]==='now',
    host: { name: state.user.name, verified: state.user.verified },
    locationType: cs.locationType, locationName: cs.location || 'Pin dropped',
    userRsvp: 'going', attendees: [{name: state.user.name, badge:'high'}], messages: []
  };
  state.events.unshift(newEvent);
  state.user.hosted += 1;
  state.createStep = { category:null, title:'', when:'today-2h', location:'', locationType:'public', capacityType:'limited', capacity:8, description:'' };
  showToast('Posted to Radius');
  switchScreen('radius');
}

/* ============================= RENDER ============================= */
function render(){
  const root = document.getElementById('frame');
  root.innerHTML = `
    ${state.screen==='radius' ? renderRadiusScreen() : ''}
    ${state.screen==='chats' ? renderChatsScreen() : ''}
    ${state.screen==='create' ? renderCreateScreen() : ''}
    ${state.screen==='profile' ? renderProfileScreen() : ''}
    ${renderBottomNav()}
    ${renderNotifPanel()}
    ${renderEventDrawer()}
    ${state.toast ? `<div class="toast show">${state.toast}</div>` : ''}
  `;
  const range = root.querySelector('input[type=range]');
  if(range){ const pct = ((state.radius-0.5)/(10-0.5))*100; range.style.setProperty('--pct', pct+'%'); }
}

function renderRadiusScreen(){
  const list = filteredEvents();
  const liveNow = state.events.filter(e=>e.live && e.distanceKm<=state.radius);
  return `
    <div class="appbar">
      <div class="appbar-row">
        <div class="brand"><div class="mark">🧭</div><span>Radius</span></div>
        <div class="appbar-actions">
          <button class="icon-btn" onclick="toggleSearch()">🔍</button>
          <button class="icon-btn" onclick="toggleNotif()">🔔${unreadCount()>0?'<span class="badge-dot"></span>':''}</button>
        </div>
      </div>
      ${state.searchOpen ? `
        <div class="search-row">
          <span>🔍</span>
          <input id="searchInput" type="text" placeholder="Search what's nearby…" value="${state.searchQuery}" oninput="setSearch(this.value)">
        </div>` : ''}
      <div class="radius-strip">
        <button class="radius-pill" onclick="toggleSlider()"><span class="ring-ic"></span>${state.radius} km</button>
        <div class="view-toggle">
          <button class="${state.radiusView==='list'?'active':''}" onclick="setRadiusView('list')">List</button>
          <button class="${state.radiusView==='radar'?'active':''}" onclick="setRadiusView('radar')">Radar</button>
        </div>
      </div>
      <div class="slider-panel ${state.sliderOpen?'open':''}">
        <div class="label-row"><span>Radius</span><span class="value">${state.radius} km</span></div>
        <input type="range" min="0.5" max="10" step="0.5" value="${state.radius}" oninput="setRadius(this.value)">
      </div>
      <div class="chips-row">
        <button class="chip-btn ${state.category==='all'?'active':''}" onclick="setCategory('all')">All</button>
        <button class="chip-btn ${state.category==='sports'?'active':''}" onclick="setCategory('sports')">🏃 Sports</button>
        <button class="chip-btn ${state.category==='social'?'active':''}" onclick="setCategory('social')">🎉 Social</button>
        <button class="chip-btn ${state.category==='civic'?'active':''}" onclick="setCategory('civic')">📣 Civic</button>
      </div>
    </div>
    ${liveNow.length>0 ? `
    <div class="live-rail">
      ${liveNow.map(e=>`
        <div class="live-item" onclick="openEvent(${e.id})">
          <div class="live-ring"><div class="inner">${e.emoji}</div></div>
          <span>${e.title.split(' ').slice(0,2).join(' ')}</span>
        </div>`).join('')}
    </div>` : ''}
    <div class="scroll">
      ${state.radiusView==='radar' ? renderRadar(list) : renderList(list)}
    </div>
  `;
}

function renderList(list){
  const now = eventsByTier(list,'now');
  const weekend = eventsByTier(list,'weekend');
  const general = eventsByTier(list,'general');
  return `
    ${renderTier('now','Happening now / today', now)}
    ${renderTier('weekend','This weekend', weekend)}
    ${renderTier('general','General discussion', general)}
  `;
}

function renderTier(key, label, list){
  return `
    <div class="tier tier-${key}">
      <div class="tier-head"><span class="tier-dot"></span><h3>${label}</h3></div>
      ${list.length===0 ? `<div class="tier-empty">Nothing here within ${state.radius}km.</div>` : list.map(renderPost).join('')}
    </div>
  `;
}

function renderPost(ev){
  const cm = CAT_META[ev.category];
  if(ev.discussion){
    return `
      <div class="post" onclick="openEvent(${ev.id})">
        <div class="post-head">
          <div class="avatar" style="background:${avatarColor(ev.host.name)}">${initials(ev.host.name)}</div>
          <div class="who"><div class="nm">${ev.host.name} ${ev.host.verified?'✓':''}</div><div class="meta">${ev.distanceKm}km away</div></div>
        </div>
        <div class="discuss-post">
          <div class="post-title">${ev.title}</div>
          <div class="tag-row"><span class="tag" style="color:${cm.color};background:${cm.bg}">${ev.emoji} ${cm.label}</span><span style="font-size:0.72rem;color:var(--ink-faint);align-self:center;">${ev.replies} repl${ev.replies===1?'y':'ies'}</span></div>
        </div>
      </div>
    `;
  }
  const capPct = ev.capacity ? Math.min(100, Math.round((ev.going/ev.capacity)*100)) : 0;
  const isFull = ev.capacity!==null && ev.going>=ev.capacity;
  const capText = ev.capacity===null ? `${ev.going} going · open` : (isFull ? `Full · ${ev.waitlist} waiting` : `${ev.going}/${ev.capacity} going`);
  const rsvpLabel = ev.userRsvp==='going' ? "Going ✓" : ev.userRsvp==='waitlist' ? 'Waitlisted' : (isFull ? 'Join waitlist' : 'RSVP');
  const rsvpClass = ev.userRsvp==='going' ? 'btn-going' : ev.userRsvp==='waitlist' ? 'btn-wait' : 'btn-primary';
  return `
    <div class="post">
      <div class="post-head" onclick="openEvent(${ev.id})">
        <div class="avatar" style="background:${avatarColor(ev.host.name)}">${initials(ev.host.name)}</div>
        <div class="who"><div class="nm">${ev.host.name} ${ev.host.verified?'✓':''}</div><div class="meta">${ev.distanceKm}km away ${ev.startLabel?'· '+ev.startLabel:''}</div></div>
        <button class="save-btn ${ev.saved?'saved':''}" onclick="toggleSave(${ev.id}, event)">${ev.saved?'★':'☆'}</button>
      </div>
      <div class="post-body" onclick="openEvent(${ev.id})">
        <div class="post-title">${ev.title}</div>
        <div class="tag-row"><span class="tag" style="color:${cm.color};background:${cm.bg}">${ev.emoji} ${cm.label}</span></div>
      </div>
      <div class="cap-row">
        <div class="cap-bar"><div class="cap-fill" style="width:${capPct}%;background:${cm.color}"></div></div>
        <span class="cap-text">${capText}</span>
      </div>
      <div class="post-actions">
        <button class="btn ${rsvpClass}" onclick="toggleRsvp(${ev.id})">${rsvpLabel}</button>
      </div>
    </div>
  `;
}

function renderRadar(list){
  const R = 130, CX=150, CY=150;
  const rings = [0.33,0.66,1].map(f=>Math.round(f*state.radius*10)/10);
  const dots = list.filter(e=>!e.discussion).map(e=>{
    const angle = (e.id * 137.5) % 360;
    const rad = angle * Math.PI/180;
    const dist = Math.min(1, e.distanceKm/state.radius) * (R-14);
    const x = CX + dist*Math.cos(rad);
    const y = CY + dist*Math.sin(rad);
    const cm = CAT_META[e.category];
    const size = e.tier==='now' ? 7 : 5.5;
    return `<circle cx="${x}" cy="${y}" r="${size}" style="fill:${cm.color};cursor:pointer;" onclick="openEvent(${e.id})"></circle>`;
  }).join('');
  return `
    <div class="radar-legend">
      <span><span class="legend-dot" style="background:var(--sports)"></span>Sports</span>
      <span><span class="legend-dot" style="background:var(--social)"></span>Social</span>
      <span><span class="legend-dot" style="background:var(--civic)"></span>Civic</span>
    </div>
    <div class="radar-wrap">
      <svg width="300" height="300" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="${R*0.33}" fill="none" stroke="var(--stroke)"></circle>
        <circle cx="150" cy="150" r="${R*0.66}" fill="none" stroke="var(--stroke)"></circle>
        <circle cx="150" cy="150" r="${R}" fill="none" stroke="var(--stroke)"></circle>
        <text x="154" y="${150-R*0.33+4}" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">${rings[0]}km</text>
        <text x="154" y="${150-R*0.66+4}" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">${rings[1]}km</text>
        <text x="154" y="${150-R+14}" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">${rings[2]}km</text>
        ${dots}
        <circle cx="150" cy="150" r="5" fill="var(--urgent)"></circle>
        <circle cx="150" cy="150" r="10" fill="none" stroke="var(--urgent)" opacity="0.4"></circle>
      </svg>
    </div>
  `;
}

function renderEventDrawer(){
  if(!state.selectedEventId) return '';
  const ev = state.events.find(e=>e.id===state.selectedEventId);
  if(!ev) return '';
  const cm = CAT_META[ev.category];
  const isGoing = ev.userRsvp==='going';
  const isFull = ev.capacity!==null && ev.going>=ev.capacity;
  const chatEligible = !ev.discussion && (ev.tier==='now' || ev.tier==='weekend');
  const chatActive = chatEligible && ev.tier==='now';

  return `
  <div class="overlay open" onclick="if(event.target===this) closeEvent()">
    <div class="drawer">
      <div class="drawer-handle"></div>
      <button class="drawer-close" onclick="closeEvent()">✕</button>

      <div class="post-head" style="padding:0;">
        <div class="avatar" style="background:${avatarColor(ev.host.name)}">${initials(ev.host.name)}</div>
        <div class="who"><div class="nm">${ev.host.name} ${ev.host.verified?'✓':''}</div><div class="meta">${ev.distanceKm}km away ${ev.startLabel?'· '+ev.startLabel:''}</div></div>
      </div>
      <h2 style="margin-top:12px;font-size:1.15rem;line-height:1.3;">${ev.title}</h2>
      <div class="tag-row" style="margin-top:8px;"><span class="tag" style="color:${cm.color};background:${cm.bg}">${ev.emoji} ${cm.label}</span></div>

      ${!ev.discussion ? `
      <div class="section-block">
        <h4>Location</h4>
        ${ev.locationType==='home' && !isGoing ? `<div class="loc-chip locked">📍 Approximate area — unlocks on RSVP</div>` : `<div class="loc-chip unlocked">📍 ${ev.locationName}</div>`}
      </div>

      <div class="section-block">
        <h4>Who's going ${ev.capacity ? `(${ev.going}/${ev.capacity})` : `(${ev.going})`}</h4>
        ${isGoing || ev.attendees.length<=3 ? ev.attendees.map(a=>{
          const b=BADGE_META[a.badge];
          return `<div class="attendee-row"><div class="avatar" style="background:${avatarColor(a.name)}">${initials(a.name)}</div><span>${a.name}</span><span class="badge-pill" style="color:${b.color};background:${b.bg}">${b.label}</span></div>`;
        }).join('') : `<div class="locked-note">RSVP to see the full list.</div>`}
      </div>

      <button class="btn btn-full-width ${isGoing ? 'btn-going' : ev.userRsvp==='waitlist' ? 'btn-wait' : 'btn-primary'}" style="width:100%;padding:12px;" onclick="toggleRsvp(${ev.id})">
        ${isGoing ? "You're going — tap to cancel" : ev.userRsvp==='waitlist' ? `On waitlist #${ev.waitlist} — tap to leave` : (isFull ? 'Join waitlist' : 'RSVP')}
      </button>

      <div class="section-block">
        <h4>Chat</h4>
        ${!isGoing ? `<div class="chat-locked">RSVP to unlock the group chat.</div>` :
          !chatActive ? `<div class="chat-locked">Opens automatically 24h before start.</div>` :
          `<div class="chat-box">
            <div id="chatScroll" style="max-height:130px;overflow-y:auto;">
              ${ev.messages.length===0 ? `<div class="chat-locked" style="padding:4px;">No messages yet.</div>` : ev.messages.map(m=>`<div class="chat-msg"><b>${m.from}:</b> ${m.text}</div>`).join('')}
            </div>
            <div class="chat-input-row">
              <input id="chatInput" type="text" placeholder="Message the group…" onkeydown="if(event.key==='Enter') sendChat(${ev.id})">
              <button onclick="sendChat(${ev.id})">Send</button>
            </div>
          </div>`}
      </div>
      ` : `
      <div class="section-block">
        <h4>${ev.replies} repl${ev.replies===1?'y':'ies'}</h4>
        <div class="locked-note">Discussion threads open in the full app.</div>
      </div>
      `}
    </div>
  </div>`;
}

      <div class="section-block">
        <h4>Settings</h4>
        <div class="settings-row"><span>Location</span><span class="r">Fuzzed ~200m</span></div>
        <div class="settings-row"><span>Push notifications</span><span class="r">On</span></div>
        <div class="settings-row"><span>Saved posts</span><span class="r">${state.events.filter(e=>e.saved).length}</span></div>
        <div class="settings-row"><span>Blocked accounts</span><span class="r">0</span></div>
      </div>
    </div>
  `;
}

function renderBottomNav(){
  return `
    <div class="bottomnav">
      <button class="nav-btn ${state.screen==='radius'?'active':''}" onclick="switchScreen('radius')"><span class="ic">🧭</span>Radius</button>
      <button class="nav-btn ${state.screen==='chats'?'active':''}" onclick="switchScreen('chats')"><span class="ic">💬</span>Chats</button>
      <button class="nav-btn" onclick="switchScreen('create')"><span class="ic nav-fab">➕</span></button>
      <button class="nav-btn ${state.screen==='profile'?'active':''}" onclick="switchScreen('profile')"><span class="ic">🙂</span>Profile</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
