<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Nook</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --outer-bg:#000000;
    --bg:#0A0A0A;
    --surface:#161616;
    --surface-2:#1F1F1F;
    --stroke:#2B2B2B;
    --ink:#F2ECE4;
    --ink-on:#14100D;
    --ink-dim:#B5ABA1;
    --ink-faint:#726A63;
    --nav-bg:rgba(10,10,10,0.92);

    --urgent:#C08A57;   --urgent-bg:#3A2A1B;
    --weekend:#D9AF63;  --weekend-bg:#3A2E18;
  }
  body[data-theme="light"]{
    --outer-bg:#E4D9C9;
    --bg:#FDFBF7;
    --surface:#F5EFEB;
    --surface-2:#FFFFFF;
    --stroke:#E4DACB;
    --ink:#2B1B17;
    --ink-on:#FDFBF7;
    --ink-dim:#6B564E;
    --ink-faint:#A69488;
    --nav-bg:rgba(253,251,247,0.92);

    --urgent:#8B5A2B;   --urgent-bg:#F3E3D6;
    --weekend:#B8763A;  --weekend-bg:#F5E8D6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--outer-bg); font-family:'Inter',sans-serif; color:var(--ink);
    min-height:100vh; display:flex; justify-content:center;
    transition:background 0.25s ease;
  }
  h1,h2,h3,h4{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  input{ font-family:inherit; }
  svg{ display:block; flex:0 0 auto; }

  #frame{
    width:100%; max-width:420px; height:100vh; background:var(--bg);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 0 1px var(--stroke);
    transition:background 0.25s ease;
  }
  @media(min-width:500px){ body{ padding:24px 0; } #frame{ height:calc(100vh - 48px); border-radius:36px; } }

  /* ---- app bar (fixed, content scrolls beneath it) ---- */
  .appbar{ padding:14px 16px; flex:0 0 auto; z-index:25; background:var(--bg); border-bottom:1px solid var(--stroke); }
  .appbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .mark{ width:26px;height:26px;border-radius:8px; background:var(--urgent); display:flex;align-items:center;justify-content:center; overflow:hidden; }
  .brand .mark img{ width:100%; height:100%; object-fit:cover; }
  .brand span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; }
  .icon-btn{ position:relative; width:36px;height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--stroke); display:flex;align-items:center;justify-content:center; color:var(--ink); }
  .icon-btn .badge-dot{ position:absolute; top:5px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--urgent); border:1.5px solid var(--bg); }
  .appbar-actions{ display:flex; gap:8px; }

  .search-row{ margin-top:0; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:9px 12px; color:var(--ink-faint); margin-bottom:12px; }
  .search-row input{ flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:0.88rem; }
  .search-row input::placeholder{ color:var(--ink-faint); }

  /* ---- radius control ---- */
  .radius-strip{ display:flex; align-items:center; gap:10px; }
  .radius-pill{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:7px 12px; font-size:0.8rem; font-weight:600; flex:0 0 auto; color:var(--ink); }
  .radius-pill svg{ color:var(--urgent); }
  .view-toggle{ display:flex; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:3px; margin-left:auto; }
  .view-toggle button{ background:none; border:none; padding:5px 10px; border-radius:16px; font-size:0.72rem; font-weight:600; color:var(--ink-faint); }
  .view-toggle button.active{ background:var(--urgent); color:var(--ink-on); }

  .slider-panel{ display:none; margin-top:10px; background:var(--surface); border:1px solid var(--stroke); border-radius:14px; padding:12px 14px; }
  .slider-panel.open{ display:block; }
  .slider-panel .label-row{ display:flex; justify-content:space-between; font-size:0.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .slider-panel .value{ font-family:'IBM Plex Mono',monospace; color:var(--urgent); font-weight:600; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:4px;
    background:linear-gradient(to right, var(--urgent) 0%, var(--urgent) var(--pct,30%), var(--stroke) var(--pct,30%), var(--stroke) 100%); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px;height:18px;border-radius:50%; background:var(--bg); border:3px solid var(--urgent); cursor:pointer; margin-top:-1px; }

  .chips-row{ display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .chip-btn{ flex:0 0 auto; display:flex; align-items:center; gap:5px; border:1px solid var(--stroke); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:0.76rem; font-weight:600; color:var(--ink-dim); }
  .chip-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--ink-on); }
  .chip-btn svg{ width:14px;height:14px; }

  /* ---- live-now rail ---- */
  .live-rail{ display:flex; gap:14px; overflow-x:auto; padding:14px 0 4px; margin:0 -16px; padding-left:16px; }
  .live-item{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px; width:60px; }
  .live-ring{ width:54px;height:54px;border-radius:50%; padding:2.5px; background:conic-gradient(var(--urgent), var(--weekend), var(--urgent)); display:flex; align-items:center; justify-content:center; }
  .live-ring .inner{ width:100%;height:100%; border-radius:50%; background:var(--bg); display:flex;align-items:center;justify-content:center; }
  .live-item span{ font-size:0.62rem; color:var(--ink-dim); text-align:center; line-height:1.15; }
  .live-ring-wrap{ position:relative; width:54px; height:54px; }
  .story-add-btn{ position:absolute; bottom:-2px; right:-2px; width:20px;height:20px;border-radius:50%; background:var(--urgent); color:var(--ink-on); border:2px solid var(--bg); display:flex;align-items:center;justify-content:center; padding:0; }

  /* ---- story viewer ---- */
  .story-overlay{ position:absolute; inset:0; background:#1A100D; z-index:70; display:none; flex-direction:column; }
  .story-overlay.open{ display:flex; }
  .story-progress{ display:flex; gap:4px; padding:10px 10px 0; }
  .story-progress .seg{ flex:1; height:2.5px; background:rgba(255,255,255,0.3); border-radius:2px; overflow:hidden; }
  .story-progress .seg .fill{ height:100%; background:#fff; }
  .story-head{ display:flex; align-items:center; gap:9px; padding:10px 14px; }
  .story-head .who{ flex:1; color:#fff; font-size:0.82rem; font-weight:600; }
  .story-head .close-btn{ background:rgba(255,255,255,0.15); border:none; width:30px;height:30px;border-radius:50%; color:#fff; display:flex;align-items:center;justify-content:center; }
  .story-media-wrap{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .story-media-wrap img, .story-media-wrap video{ width:100%; height:100%; object-fit:cover; }
  .story-tap-zone{ position:absolute; top:0; bottom:0; width:35%; }
  .story-tap-zone.left{ left:0; }
  .story-tap-zone.right{ right:0; }
  .story-caption{ position:absolute; left:0; right:0; bottom:70px; text-align:center; color:#fff; font-size:0.9rem; padding:0 24px; text-shadow:0 2px 8px rgba(0,0,0,0.6); }
  .story-footer{ padding:14px; }
  .story-add-update{ width:100%; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; border-radius:12px; padding:11px; font-size:0.84rem; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .story-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); gap:14px; padding:20px; text-align:center; font-size:0.86rem; }

  /* ---- scroll ---- */
  .scroll{ flex:1; overflow-y:auto; padding:14px 16px 100px; }
  .scroll::-webkit-scrollbar{ width:0; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:0.86rem; }
  .empty-state svg{ margin:0 auto 10px; color:var(--ink-faint); }

  /* ---- post card (social-feed style) ---- */
  .post{ background:var(--surface); border:1px solid var(--stroke); border-radius:16px; margin-bottom:12px; overflow:hidden; }
  .post-head{ display:flex; align-items:center; gap:9px; padding:12px 13px 0; }
  .avatar{ width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:0.72rem; font-weight:700; color:var(--ink-on); flex:0 0 auto;}
  .post-head .who{ flex:1; min-width:0; }
  .post-head .who .nm{ font-size:0.83rem; font-weight:600; display:flex; align-items:center; gap:4px; }
  .post-head .who .nm .verified-ic{ color:var(--weekend); }
  .post-head .who .meta{ font-size:0.68rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:5px; }
  .post-head .who .meta .live-tag{ display:inline-flex; align-items:center; gap:3px; color:var(--urgent); font-weight:600; }
  .post-head .who .meta .live-dot{ width:5px;height:5px;border-radius:50%; background:var(--urgent); }
  .save-btn{ background:none; border:none; color:var(--ink-faint); padding:4px; }
  .save-btn.saved{ color:var(--weekend); }

  .post-body{ padding:10px 13px 0; }
  .post-title{ font-size:0.95rem; font-weight:600; line-height:1.35; }
  .tag-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:0.65rem; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.02em;}
  .tag svg{ width:12px;height:12px; }

  .cap-row{ display:flex; align-items:center; gap:8px; margin:10px 13px 0; }
  .cap-bar{ flex:1; height:4px; background:var(--stroke); border-radius:6px; overflow:hidden; }
  .cap-fill{ height:100%; border-radius:6px; }
  .cap-text{ font-size:0.65rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }

  .post-actions{ display:flex; gap:8px; padding:12px 13px 13px; }
  .btn{ border:none; border-radius:10px; padding:10px 14px; font-size:0.8rem; font-weight:700; flex:1; text-align:center; }
  .btn-primary{ background:var(--ink); color:var(--ink-on); }
  .btn-going{ background:var(--weekend); color:var(--ink-on); }
  .btn-wait{ background:var(--urgent-bg); color:var(--urgent); }

  .discuss-post{ padding:12px 13px 14px; }

  /* ---- radar view ---- */
  .radar-wrap{ display:flex; justify-content:center; padding:20px 0 6px; }
  .radar-legend{ display:flex; justify-content:center; gap:14px; font-size:0.68rem; color:var(--ink-dim); margin-bottom:6px; }
  .radar-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:7px;height:7px;border-radius:50%; }

  /* ---- bottom nav ---- */
  .bottomnav{ position:absolute; bottom:0; left:0; right:0; height:66px; background:var(--nav-bg); backdrop-filter:blur(10px); border-top:1px solid var(--stroke); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; position:relative; }
  .nav-btn.active{ color:var(--ink); }
  .nav-fab{ background:var(--urgent); color:var(--ink-on); width:44px;height:44px;border-radius:16px; display:flex;align-items:center;justify-content:center; margin-top:-12px; box-shadow:0 6px 16px rgba(160,82,45,0.35); }

  /* ---- notif panel ---- */
  .notif-panel{ position:absolute; top:60px; right:14px; width:280px; background:var(--surface-2); border:1px solid var(--stroke); border-radius:14px; z-index:45; box-shadow:0 20px 40px rgba(43,27,23,0.18); display:none; overflow:hidden; }
  .notif-panel.open{ display:block; }
  .notif-panel .np-head{ padding:12px 14px; font-size:0.78rem; font-weight:700; border-bottom:1px solid var(--stroke); }
  .notif-item{ padding:11px 14px; border-bottom:1px solid var(--stroke); font-size:0.78rem; color:var(--ink-dim); display:flex; gap:8px; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item.unread{ color:var(--ink); background:rgba(160,82,45,0.07); }
  .notif-item .n-dot{ width:6px;height:6px;border-radius:50%; background:var(--urgent); margin-top:5px; flex:0 0 auto; }
  .notif-item .n-dot.read{ background:transparent; }

  /* ---- overlay / drawer ---- */
  .overlay{ position:absolute; inset:0; background:rgba(43,27,23,0.55); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .overlay.open{ display:flex; }
  .drawer{ background:var(--bg); width:100%; max-height:90%; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px 30px; animation:slideup 0.2s ease; border-top:1px solid var(--stroke); }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0.5; } to{ transform:translateY(0); opacity:1; } }
  .drawer-handle{ width:36px; height:4px; background:var(--stroke); border-radius:4px; margin:0 auto 14px; }
  .drawer-close{ position:absolute; top:14px; right:16px; background:var(--surface); border:1px solid var(--stroke); width:30px;height:30px; border-radius:50%; color:var(--ink); display:flex;align-items:center;justify-content:center; }

  .section-block{ margin:16px 0; }
  .section-block h4{ font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-bottom:8px; }
  .loc-chip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:8px 13px; font-size:0.8rem; }
  .loc-chip.locked{ color:var(--ink-dim); }
  .loc-chip.unlocked{ color:var(--weekend); border-color:var(--weekend-bg); background:var(--weekend-bg); }

  .attendee-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--stroke); font-size:0.85rem; }
  .attendee-row:last-child{ border-bottom:none; }
  .badge-pill{ font-family:'IBM Plex Mono',monospace; font-size:0.6rem; padding:2px 7px; border-radius:10px; margin-left:auto; }
  .locked-note{ font-size:0.78rem; color:var(--ink-faint); }

  .chat-box{ background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:10px; }
  .chat-msg{ font-size:0.82rem; margin-bottom:8px; color:var(--ink-dim); }
  .chat-msg b{ color:var(--urgent); }
  .chat-input-row{ display:flex; gap:6px; margin-top:8px; }
  .chat-input-row input{ flex:1; border:1px solid var(--stroke); border-radius:20px; padding:9px 12px; font-size:0.82rem; background:var(--bg); color:var(--ink); outline:none; }
  .chat-input-row button{ background:var(--urgent); color:var(--ink-on); border:none; border-radius:20px; width:38px;height:38px; display:flex;align-items:center;justify-content:center; }
  .chat-locked{ text-align:center; padding:14px 10px; color:var(--ink-faint); font-size:0.8rem; }

  /* ---- chats tab ---- */
  .chat-row{ display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--stroke); }
  .chat-row .who{ flex:1; min-width:0; }
  .chat-row .nm{ font-size:0.88rem; font-weight:600; }
  .chat-row .preview{ font-size:0.76rem; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-row .status{ font-size:0.65rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }

  /* ---- create screen ---- */
  .cat-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .cat-pick .opt{ border:1.5px solid var(--stroke); background:var(--surface); border-radius:14px; padding:16px 10px; text-align:center; }
  .cat-pick .opt.selected{ border-color:var(--ink); background:var(--surface-2); }
  .cat-pick .opt svg{ margin:0 auto; }
  .cat-pick .opt .nm{ font-size:0.8rem; font-weight:600; margin-top:8px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; font-family:'IBM Plex Mono',monospace; }
  .field input, .field textarea{ width:100%; border:1px solid var(--stroke); border-radius:10px; padding:10px 12px; font-size:0.9rem; background:var(--surface); color:var(--ink); outline:none; }
  .field textarea{ resize:vertical; min-height:56px; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--stroke); background:var(--surface); border-radius:10px; padding:9px; font-size:0.78rem; font-weight:600; color:var(--ink-dim); }
  .seg button.active{ background:var(--ink); color:var(--ink-on); border-color:var(--ink); }

  .toast{ position:absolute; bottom:80px; left:16px; right:16px; background:var(--surface-2); border:1px solid var(--stroke); color:var(--ink); padding:12px 16px; border-radius:12px; font-size:0.84rem; text-align:center; z-index:50; opacity:0; transform:translateY(10px); transition:all 0.25s ease; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---- profile ---- */
  .profile-head{ text-align:center; padding:16px 0 18px; }
  .profile-avatar{ width:62px;height:62px;border-radius:50%; background:var(--urgent); color:var(--ink-on); display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:700; margin:0 auto 10px; }
  .stat-row{ display:flex; gap:10px; margin-top:14px; }
  .stat-card{ flex:1; background:var(--surface); border:1px solid var(--stroke); border-radius:12px; padding:12px; text-align:center; }
  .stat-card .num{ font-family:'Space Grotesk',sans-serif; font-size:1.25rem; font-weight:700; }
  .stat-card .lbl{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:2px; }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .earned-badge{ background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:6px 12px; font-size:0.74rem; display:flex; align-items:center; gap:6px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--stroke); font-size:0.86rem; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .r{ color:var(--ink-faint); font-size:0.78rem; }
</style>
</head>
<body>
<div id="frame"></div>

<script>
/* ============================= ICONS ============================= */
const ICON_PATHS = {
  compass: '<circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>',
  target: '<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.4"></circle>',
  search: '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  message: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',

function setTheme(mode){
  state.theme = mode === 'light' ? 'light' : 'dark';
  if(state.theme === 'light'){ document.body.setAttribute('data-theme', 'light'); }
  else { document.body.removeAttribute('data-theme'); }
  try { localStorage.setItem('nook-theme', state.theme); } catch(e){}
  render();
}
function toggleTheme(){ setTheme(state.theme === 'dark' ? 'light' : 'dark'); }
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('nook-theme'); } catch(e){}
  state.theme = saved === 'light' ? 'light' : 'dark';
  if(state.theme === 'light'){ document.body.setAttribute('data-theme', 'light'); }
}

/* ============================= HELPERS ============================= */
function showToast(msg){ state.toast = msg; render(); setTimeout(function(){ state.toast=null; render(); }, 1700); }
function initials(name){ return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function avatarColor(name){ const colors=['var(--urgent)','var(--weekend)','var(--ink-dim)']; let h=0; for(const c of name) h+=c.charCodeAt(0); return colors[h % colors.length]; }
function unreadCount(){ return state.notifications.filter(function(n){return !n.read;}).length; }

function filteredEvents(){
  return state.events.filter(function(e){
    if(e.distanceKm > state.radius) return false;
    if(state.category!=='all' && e.category!==state.category) return false;
    if(state.searchQuery && e.title.toLowerCase().indexOf(state.searchQuery.toLowerCase())===-1) return false;
    return true;
  });
}

function setRadius(v){ state.radius = parseFloat(v); render(); }
function toggleSlider(){ state.sliderOpen = !state.sliderOpen; render(); }
function setCategory(c){ state.category = c; render(); }
function setRadiusView(v){ state.radiusView = v; render(); }
function toggleSearch(){ state.searchOpen = !state.searchOpen; if(!state.searchOpen) state.searchQuery=''; render(); if(state.searchOpen){ setTimeout(function(){ const el=document.getElementById('searchInput'); if(el) el.focus(); },0); } }

function toggleNotif(){ state.notifOpen = !state.notifOpen; if(state.notifOpen) state.notifications.forEach(function(n){ n.read=true; }); render(); }
function switchScreen(s){ state.screen = s; state.selectedEventId=null; state.notifOpen=false; render(); }
function openEvent(id){ state.selectedEventId = id; state.notifOpen=false; render(); }
function closeEvent(){ state.selectedEventId = null; render(); }
function toggleSave(id, ev){ if(ev) ev.stopPropagation(); const e = state.events.find(function(x){return x.id===id;}); e.saved = !e.saved; render(); }

function openStory(id, evt){ if(evt) evt.stopPropagation(); state.storyViewer = { eventId: id, index: 0 }; render(); }
function closeStory(){ state.storyViewer = null; render(); }
function nextStory(){
  const sv = state.storyViewer; if(!sv) return;
  const ev = state.events.find(function(e){return e.id===sv.eventId;});
  const stories = (ev && ev.stories) || [];
  if(sv.index < stories.length-1){ sv.index += 1; render(); } else { closeStory(); }
}
function prevStory(){
  const sv = state.storyViewer; if(!sv) return;
  if(sv.index > 0){ sv.index -= 1; render(); }
}
function triggerStoryUpload(id, evt){
  if(evt) evt.stopPropagation();
  state.pendingStoryEventId = id;
  const input = document.getElementById('storyFileInput');
  if(input) input.click();
}
function handleStoryFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  const targetId = state.pendingStoryEventId;
  if(!file || !targetId) return;
  const reader = new FileReader();
  reader.onload = function(){
    const ev = state.events.find(function(e){return e.id===targetId;});
    if(!ev) return;
    if(!ev.stories) ev.stories = [];
    const type = file.type.indexOf('video') === 0 ? 'video' : 'image';
    ev.stories.push({ type: type, url: reader.result, caption: '' });
    state.storyViewer = { eventId: targetId, index: ev.stories.length-1 };
    inputEl.value = '';
    showToast('Update added');
    render();
  };
  reader.readAsDataURL(file);
}

function toggleRsvp(id){
  const ev = state.events.find(function(e){return e.id===id;});
  if(!ev) return;
  if(ev.userRsvp === 'none'){
    if(ev.capacity!==null && ev.going>=ev.capacity){
      ev.waitlist += 1; ev.userRsvp = 'waitlist';
      showToast("You're #" + ev.waitlist + " on the waitlist");
    } else {
      ev.going += 1; ev.userRsvp = 'going'; state.user.going += 1;
      showToast("You're in, check the Chats tab");
    }
  } else if(ev.userRsvp === 'going'){
    ev.going -= 1; ev.userRsvp = 'none'; state.user.going -= 1;
    showToast('RSVP cancelled');
  } else if(ev.userRsvp === 'waitlist'){
    ev.waitlist -= 1; ev.userRsvp = 'none';
    showToast('Left the waitlist');
  }
  render();
}

function sendChat(id){
  const ev = state.events.find(function(e){return e.id===id;});
  const input = document.getElementById('chatInput');
  if(!input || !input.value.trim()) return;
  ev.messages.push({from: state.user.name, text: input.value.trim()});
  input.value=''; render();
  setTimeout(function(){ const box=document.getElementById('chatScroll'); if(box) box.scrollTop = box.scrollHeight; },0);
}

function submitCreate(){
  const cs = state.createStep;
  if(!cs.category || !cs.title.trim()){ showToast('Add a category and title first'); return; }
  const whenMap = {'today-2h':'Today . soon','today-6h':'Today . later','sat':'Sat . time TBD','sun':'Sun . time TBD'};
  const newEvent = {
    id: Date.now(), title: cs.title, category: cs.category, tier:null, whenLabel: whenMap[cs.when], distanceKm: 0.3,
    capacity: cs.capacityType==='unlimited' ? null : parseInt(cs.capacity)||8,
    going: 1, waitlist: 0, saved:false, live: cs.when==='today-2h',
    host: { name: state.user.name, verified: state.user.verified },
    locationType: cs.locationType, locationName: cs.location || 'Pin dropped',
    userRsvp: 'going', attendees: [{name: state.user.name, badge:'high'}], messages: []
  };
  state.events.unshift(newEvent);
  state.user.hosted += 1;
  state.createStep = { category:null, title:'', when:'today-2h', location:'', locationType:'public', capacityType:'limited', capacity:8, description:'' };
  showToast('Posted to Radius');
  switchScreen('radius');
}

/* ============================= RENDER ============================= */
function render(){
  const root = document.getElementById('frame');
  root.innerHTML =
    (state.screen==='radius' ? renderRadiusScreen() : '') +
    (state.screen==='chats' ? renderChatsScreen() : '') +
    (state.screen==='create' ? renderCreateScreen() : '') +
    (state.screen==='profile' ? renderProfileScreen() : '') +
    renderBottomNav() +
    renderNotifPanel() +
    renderEventDrawer() +
    renderStoryViewer() +
    '<input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none" onchange="handleStoryFile(this)">' +
    (state.toast ? '<div class="toast show">' + state.toast + '</div>' : '');
  const range = root.querySelector('input[type=range]');
  if(range){ const pct = ((state.radius-0.5)/(10-0.5))*100; range.style.setProperty('--pct', pct+'%'); }
}

function renderAppBar(){
  return (
    '<div class="appbar"><div class="appbar-row">' +
      '<div class="brand"><div class="mark"><img src="icon-mark-light.png" alt="Nook"></div><span>Nook</span></div>' +
      '<div class="appbar-actions">' +
        '<button class="icon-btn" onclick="toggleTheme()">' + icon(state.theme==='dark'?'sun':'moon',17) + '</button>' +
        '<button class="icon-btn" onclick="toggleSearch()">' + icon('search',18) + '</button>' +
        '<button class="icon-btn" onclick="toggleNotif()">' + icon('bell',18) + (unreadCount()>0?'<span class="badge-dot"></span>':'') + '</button>' +
      '</div>' +
    '</div></div>'
  );
}

function renderRadiusScreen(){
  const list = filteredEvents();
  const liveNow = state.events.filter(function(e){ return e.live && e.distanceKm<=state.radius; });
  let html = renderAppBar();
  html += '<div class="scroll">';
  if(state.searchOpen){
    html += '<div class="search-row">' + icon('search',16) + '<input id="searchInput" type="text" placeholder="Search what\'s nearby" value="' + state.searchQuery + '" oninput="setSearch(this.value)"></div>';
  }
  html += '<div class="radius-strip">';
  html += '<button class="radius-pill" onclick="toggleSlider()">' + icon('target',16) + '<span>' + state.radius + ' km</span></button>';
  html += '<div class="view-toggle"><button class="' + (state.radiusView==='list'?'active':'') + '" onclick="setRadiusView(\'list\')">List</button><button class="' + (state.radiusView==='radar'?'active':'') + '" onclick="setRadiusView(\'radar\')">Radar</button></div>';
  html += '</div>';
  html += '<div class="slider-panel ' + (state.sliderOpen?'open':'') + '"><div class="label-row"><span>Radius</span><span class="value">' + state.radius + ' km</span></div><input type="range" min="0.5" max="10" step="0.5" value="' + state.radius + '" oninput="setRadius(this.value)"></div>';
  html += '<div class="chips-row">';
  html += '<button class="chip-btn ' + (state.category==='all'?'active':'') + '" onclick="setCategory(\'all\')">All</button>';
  html += '<button class="chip-btn ' + (state.category==='sports'?'active':'') + '" onclick="setCategory(\'sports\')">' + icon('activity',14) + '<span>Sports</span></button>';
  html += '<button class="chip-btn ' + (state.category==='social'?'active':'') + '" onclick="setCategory(\'social\')">' + icon('users',14) + '<span>Social</span></button>';
  html += '<button class="chip-btn ' + (state.category==='civic'?'active':'') + '" onclick="setCategory(\'civic\')">' + icon('volume',14) + '<span>Civic</span></button>';
  html += '<button class="chip-btn ' + (state.category==='business'?'active':'') + '" onclick="setCategory(\'business\')">' + icon('bag',14) + '<span>Businesses</span></button>';
  html += '</div>';
  if(liveNow.length>0){
    html += '<div class="live-rail">';
    liveNow.forEach(function(e){
      const cm = CAT_META[e.category];
      const stories = e.stories || [];
      const canAdd = e.userRsvp==='going' || e.host.name===state.user.name;
      html += '<div class="live-item">';
      html += '<div class="live-ring-wrap">';
      html += '<div class="live-ring" onclick="openStory(' + e.id + ')"><div class="inner" style="color:' + cm.color + '">' + icon(cm.ic,22) + '</div></div>';
      if(canAdd){ html += '<button class="story-add-btn" onclick="triggerStoryUpload(' + e.id + ', event)">' + icon('plus',11) + '</button>'; }
      html += '</div>';
      html += '<span onclick="openEvent(' + e.id + ')">' + e.title.split(' ').slice(0,2).join(' ') + '</span></div>';
    });
    html += '</div>';
  }
  html += (state.radiusView==='radar' ? renderRadar(list) : renderFeedList(list));
  html += '</div>';
  return html;
}

function renderFeedList(list){
  if(list.length===0){
    return '<div class="empty-state">' + icon('target',28) + '<div>Nothing here within ' + state.radius + 'km. Try widening your radius or changing filters.</div></div>';
  }
  return list.map(renderPost).join('');
}

  const capText = ev.capacity===null ? (ev.going + ' going . open') : (isFull ? ('Full . ' + ev.waitlist + ' waiting') : (ev.going + '/' + ev.capacity + ' going'));
  const rsvpLabel = ev.userRsvp==='going' ? 'Going' : ev.userRsvp==='waitlist' ? 'Waitlisted' : (isFull ? 'Join waitlist' : 'RSVP');
  const rsvpClass = ev.userRsvp==='going' ? 'btn-going' : ev.userRsvp==='waitlist' ? 'btn-wait' : 'btn-primary';
  return (
    '<div class="post">' +
      '<div class="post-head" onclick="openEvent(' + ev.id + ')"><div class="avatar" style="background:' + avatarColor(ev.host.name) + '">' + initials(ev.host.name) + '</div>' +
      '<div class="who"><div class="nm">' + ev.host.name + (ev.host.verified?'<span class="verified-ic">'+icon('check',12)+'</span>':'') + '</div>' +

      '<button class="save-btn ' + (ev.saved?'saved':'') + '" onclick="toggleSave(' + ev.id + ', event)">' + icon('star',18,ev.saved) + '</button></div>' +
      '<div class="post-body" onclick="openEvent(' + ev.id + ')"><div class="post-title">' + ev.title + '</div>' +
      '<div class="tag-row"><span class="tag" style="color:' + cm.color + ';background:' + cm.bg + '">' + icon(cm.ic,12) + '<span>' + cm.label + '</span></span></div></div>' +
      '<div class="cap-row"><div class="cap-bar"><div class="cap-fill" style="width:' + capPct + '%;background:' + cm.color + '"></div></div><span class="cap-text">' + capText + '</span></div>' +
      '<div class="post-actions"><button class="btn ' + rsvpClass + '" onclick="toggleRsvp(' + ev.id + ')">' + rsvpLabel + '</button></div>' +
    '</div>'
  );
}

function renderRadar(list){
  const R = 130, CX=150, CY=150;
  const rings = [0.33,0.66,1].map(function(f){ return Math.round(f*state.radius*10)/10; });
  const dots = list.filter(function(e){return !e.discussion;}).map(function(e){
    const angle = (e.id * 137.5) % 360;
    const rad = angle * Math.PI/180;
    const dist = Math.min(1, e.distanceKm/state.radius) * (R-14);
    const x = CX + dist*Math.cos(rad);
    const y = CY + dist*Math.sin(rad);
    const size = e.live ? 7 : 5.5;
    const fillColor = e.live ? 'var(--urgent)' : 'var(--ink-dim)';
    return '<circle cx="' + x + '" cy="' + y + '" r="' + size + '" style="fill:' + fillColor + ';cursor:pointer;" onclick="openEvent(' + e.id + ')"></circle>';
  }).join('');
  return (
    '<div class="radar-legend">' +
      '<span><span class="legend-dot" style="background:var(--urgent)"></span>Live now</span>' +
      '<span><span class="legend-dot" style="background:var(--ink-dim)"></span>Upcoming</span>' +
    '</div>' +
    '<div class="radar-wrap"><svg width="300" height="300" viewBox="0 0 300 300">' +
      '<circle cx="150" cy="150" r="' + (R*0.33) + '" fill="none" stroke="var(--stroke)"></circle>' +
      '<circle cx="150" cy="150" r="' + (R*0.66) + '" fill="none" stroke="var(--stroke)"></circle>' +
      '<circle cx="150" cy="150" r="' + R + '" fill="none" stroke="var(--stroke)"></circle>' +
      '<text x="154" y="' + (150-R*0.33+4) + '" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">' + rings[0] + 'km</text>' +
      '<text x="154" y="' + (150-R*0.66+4) + '" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">' + rings[1] + 'km</text>' +
      '<text x="154" y="' + (150-R+14) + '" fill="var(--ink-faint)" font-size="9" font-family="IBM Plex Mono">' + rings[2] + 'km</text>' +
      dots +
      '<circle cx="150" cy="150" r="5" fill="var(--urgent)"></circle>' +
      '<circle cx="150" cy="150" r="10" fill="none" stroke="var(--urgent)" opacity="0.4"></circle>' +
    '</svg></div>'
  );
}

function renderEventDrawer(){
  if(!state.selectedEventId) return '';
  const ev = state.events.find(function(e){return e.id===state.selectedEventId;});
  if(!ev) return '';
  const cm = CAT_META[ev.category];
  const isGoing = ev.userRsvp==='going';
  const isFull = ev.capacity!==null && ev.going>=ev.capacity;
  const chatEligible = !ev.discussion;
  const chatActive = chatEligible && ev.live;

  let inner = '<div class="drawer-handle"></div><button class="drawer-close" onclick="closeEvent()">' + icon('x',16) + '</button>';
  inner += '<div class="post-head" style="padding:0;"><div class="avatar" style="background:' + avatarColor(ev.host.name) + '">' + initials(ev.host.name) + '</div>';
  inner += '<div class="who"><div class="nm">' + ev.host.name + (ev.host.verified?'<span class="verified-ic">'+icon('check',12)+'</span>':'') + '</div><div class="meta">' + ev.whenLabel + ' &middot; ' + ev.distanceKm + 'km away</div></div></div>';
  inner += '<h2 style="margin-top:12px;font-size:1.15rem;line-height:1.3;">' + ev.title + '</h2>';
  inner += '<div class="tag-row" style="margin-top:8px;"><span class="tag" style="color:' + cm.color + ';background:' + cm.bg + '">' + icon(cm.ic,12) + '<span>' + cm.label + '</span></span></div>';

  if(!ev.discussion){
    inner += '<div class="section-block"><h4>Location</h4>';
    if(ev.locationType==='home' && !isGoing){
      inner += '<div class="loc-chip locked">' + icon('pin',14) + '<span>Approximate area, unlocks on RSVP</span></div>';
    } else {
      inner += '<div class="loc-chip unlocked">' + icon('pin',14) + '<span>' + ev.locationName + '</span></div>';
    }
    inner += '</div>';

    inner += '<div class="section-block"><h4>Who\'s going (' + (ev.capacity ? ev.going+'/'+ev.capacity : ev.going) + ')</h4>';
    if(isGoing || ev.attendees.length<=3){
      inner += ev.attendees.map(function(a){
        const b = BADGE_META[a.badge];
        return '<div class="attendee-row"><div class="avatar" style="background:' + avatarColor(a.name) + '">' + initials(a.name) + '</div><span>' + a.name + '</span><span class="badge-pill" style="color:' + b.color + ';background:' + b.bg + '">' + b.label + '</span></div>';
      }).join('');
    } else {
      inner += '<div class="locked-note">RSVP to see the full list.</div>';
    }
    inner += '</div>';

    inner += '<button class="btn btn-full-width ' + (isGoing?'btn-going':ev.userRsvp==='waitlist'?'btn-wait':'btn-primary') + '" style="width:100%;padding:12px;" onclick="toggleRsvp(' + ev.id + ')">' +
      (isGoing ? "You're going, tap to cancel" : ev.userRsvp==='waitlist' ? ('On waitlist #' + ev.waitlist + ', tap to leave') : (isFull ? 'Join waitlist' : 'RSVP')) +
    '</button>';

    inner += '<div class="section-block"><h4>Chat</h4>';
    if(!isGoing){
      inner += '<div class="chat-locked">RSVP to unlock the group chat.</div>';
    } else if(!chatActive){
      inner += '<div class="chat-locked">Opens automatically 24h before start.</div>';
    } else {
      inner += '<div class="chat-box"><div id="chatScroll" style="max-height:130px;overflow-y:auto;">';
      inner += ev.messages.length===0 ? '<div class="chat-locked" style="padding:4px;">No messages yet.</div>' : ev.messages.map(function(m){ return '<div class="chat-msg"><b>' + m.from + ':</b> ' + m.text + '</div>'; }).join('');
      inner += '</div><div class="chat-input-row"><input id="chatInput" type="text" placeholder="Message the group" onkeydown="if(event.key===\'Enter\') sendChat(' + ev.id + ')"><button onclick="sendChat(' + ev.id + ')">' + icon('send',15) + '</button></div></div>';
    }
    inner += '</div>';
  } else {
    inner += '<div class="section-block"><h4>' + ev.replies + (ev.replies===1?' reply':' replies') + '</h4><div class="locked-note">Discussion threads open in the full app.</div></div>';
  }

  return '<div class="overlay open" onclick="if(event.target===this) closeEvent()"><div class="drawer">' + inner + '</div></div>';
}

function renderStoryViewer(){
  if(!state.storyViewer) return '';
  const ev = state.events.find(function(e){return e.id===state.storyViewer.eventId;});
  if(!ev) return '';
  const stories = ev.stories || [];
  const cm = CAT_META[ev.category];
  const canAdd = ev.userRsvp==='going' || ev.host.name===state.user.name;

  let html = '<div class="story-overlay open">';

  if(stories.length===0){
    html += '<div class="story-head"><div class="who">' + ev.title.split(' ').slice(0,5).join(' ') + '</div><button class="close-btn" onclick="closeStory()">' + icon('x',15) + '</button></div>';
    html += '<div class="story-empty">' + icon(cm.ic,32) + '<div>No updates from this event yet.</div>';
    if(canAdd){ html += '<button class="story-add-update" onclick="triggerStoryUpload(' + ev.id + ', event)">' + icon('plus',16) + '<span>Add a photo or video</span></button>'; }
    html += '</div></div>';
    return html;
  }

  const idx = Math.min(state.storyViewer.index, stories.length-1);
  const s = stories[idx];

  html += '<div class="story-progress">';
  stories.forEach(function(st, i){
    html += '<div class="seg"><div class="fill" style="width:' + (i<idx?'100%':i===idx?'100%':'0%') + '"></div></div>';
  });
  html += '</div>';

  html += '<div class="story-head"><div class="avatar" style="background:' + avatarColor(ev.host.name) + ';width:28px;height:28px;font-size:0.65rem;">' + initials(ev.host.name) + '</div>';
  html += '<div class="who">' + ev.host.name + '</div><button class="close-btn" onclick="closeStory()">' + icon('x',15) + '</button></div>';

  html += '<div class="story-media-wrap">';
  html += s.type==='video'
    ? '<video src="' + s.url + '" autoplay muted loop playsinline></video>'
    : '<img src="' + s.url + '">';
  if(s.caption){ html += '<div class="story-caption">' + s.caption + '</div>'; }
  html += '<div class="story-tap-zone left" onclick="prevStory()"></div>';
  html += '<div class="story-tap-zone right" onclick="nextStory()"></div>';
  html += '</div>';

  if(canAdd){
    html += '<div class="story-footer"><button class="story-add-update" onclick="triggerStoryUpload(' + ev.id + ', event)">' + icon('plus',16) + '<span>Add another update</span></button></div>';
  }

  html += '</div>';
  return html;
}

function renderNotifPanel(){
  let html = '<div class="notif-panel ' + (state.notifOpen?'open':'') + '"><div class="np-head">Notifications</div>';
  html += state.notifications.map(function(n){
    return '<div class="notif-item ' + (!n.read?'unread':'') + '"><span class="n-dot ' + (n.read?'read':'') + '"></span><span>' + n.text + '</span></div>';
  }).join('');
  html += '</div>';
  return html;
}

function renderChatsScreen(){
  const chats = state.events.filter(function(e){ return !e.discussion && e.userRsvp==='going'; });
  let html = renderAppBar() + '<div class="scroll">';
  if(chats.length===0){
    html += '<div class="empty-state">' + icon('message',28) + '<div>RSVP to an event to unlock its group chat here.</div></div>';
  } else {
    html += chats.map(function(ev){
      const active = ev.live;
      const last = ev.messages[ev.messages.length-1];
      const cm = CAT_META[ev.category];
      return (
        '<div class="chat-row" onclick="openEvent(' + ev.id + ')">' +
        '<div class="avatar" style="background:' + cm.color + '">' + icon(cm.ic,16) + '</div>' +
        '<div class="who"><div class="nm">' + ev.title.split(' ').slice(0,4).join(' ') + '</div>' +
        '<div class="preview">' + (active ? (last ? last.from+': '+last.text : 'No messages yet') : 'Opens 24h before start') + '</div></div>' +
        '<span class="status">' + (active?'LIVE':'SOON') + '</span></div>'
      );
    }).join('');
  }
  html += '</div>';
  return html;
}

function renderCreateScreen(){
  const cs = state.createStep;
  let html = renderAppBar() + '<div class="scroll">';
  html += '<div class="field"><label>What are you hosting?</label></div>';
  html += '<div class="cat-pick">';
  ['sports','social','civic','business'].forEach(function(cat){
    const cm = CAT_META[cat];
    html += '<div class="opt ' + (cs.category===cat?'selected':'') + '" onclick="pickCreateCategory(\'' + cat + '\')" style="color:' + (cs.category===cat?cm.color:'var(--ink-dim)') + '">' + icon(cm.ic,26) + '<div class="nm" style="color:var(--ink);">' + cm.label + '</div></div>';
  });
  html += '</div>';
  if(cs.category){
    html += '<div class="field"><label>Title</label><input type="text" value="' + cs.title + '" placeholder="e.g. Saturday morning run" oninput="setCreateField(\'title\', this.value)"></div>';
    html += '<div class="field"><label>When</label><div class="seg">' +
      '<button class="' + (cs.when==='today-2h'?'active':'') + '" onclick="setCreateField(\'when\',\'today-2h\')">Today, soon</button>' +
      '<button class="' + (cs.when==='sat'?'active':'') + '" onclick="setCreateField(\'when\',\'sat\')">Saturday</button>' +
      '<button class="' + (cs.when==='sun'?'active':'') + '" onclick="setCreateField(\'when\',\'sun\')">Sunday</button></div></div>';
    html += '<div class="field"><label>Location</label><input type="text" value="' + cs.location + '" placeholder="e.g. Lincoln Park, Court 2" oninput="setCreateField(\'location\', this.value)">' +
      '<div class="seg" style="margin-top:8px;"><button class="' + (cs.locationType==='public'?'active':'') + '" onclick="setCreateField(\'locationType\',\'public\')">Public spot</button>' +
      '<button class="' + (cs.locationType==='home'?'active':'') + '" onclick="setCreateField(\'locationType\',\'home\')">Hosted at home</button></div></div>';
    html += '<div class="field"><label>Capacity</label><div class="seg"><button class="' + (cs.capacityType==='limited'?'active':'') + '" onclick="setCreateField(\'capacityType\',\'limited\')">Limited</button>' +
      '<button class="' + (cs.capacityType==='unlimited'?'active':'') + '" onclick="setCreateField(\'capacityType\',\'unlimited\')">Unlimited</button></div>' +
      (cs.capacityType==='limited' ? '<input type="number" min="2" value="' + cs.capacity + '" style="margin-top:8px;" oninput="setCreateField(\'capacity\', this.value)">' : '') + '</div>';
    html += '<div class="field"><label>Details (optional)</label><textarea placeholder="Anything neighbors should know" oninput="setCreateField(\'description\', this.value)">' + cs.description + '</textarea></div>';
    html += '<button class="btn btn-primary" style="width:100%;padding:13px;" onclick="submitCreate()">Post to Radius</button>';
  }
  html += '</div>';
  return html;
}

function renderProfileScreen(){
  const u = state.user;
  let html = renderAppBar() + '<div class="scroll">';
  html += '<div class="profile-head"><div class="profile-avatar">' + u.initial + '</div><h3>' + u.name + (u.verified?' <span style="color:var(--weekend);">'+icon('check',16)+'</span>':'') + '</h3>';
  html += '<div class="mono" style="font-size:0.7rem;color:var(--ink-faint);margin-top:4px;">' + u.tenureDays + ' days on Nook</div></div>';
  html += '<div class="stat-row"><div class="stat-card"><div class="num">' + u.reliability + '%</div><div class="lbl">Reliability</div></div>' +
    '<div class="stat-card"><div class="num">' + u.going + '</div><div class="lbl">Going to</div></div>' +
    '<div class="stat-card"><div class="num">' + u.hosted + '</div><div class="lbl">Hosted</div></div></div>';
  html += '<div class="section-block"><h4>Badges</h4><div class="badge-row">' +
    '<span class="earned-badge">' + icon('check',14) + '<span>Verified Neighbor</span></span>' +
    '<span class="earned-badge">' + icon('star',14) + '<span>Reliable attendee</span></span>' +
    '<span class="earned-badge">' + icon('clock',14) + '<span>Founding member</span></span></div></div>';
  html += '<div class="section-block"><h4>Appearance</h4><div class="seg">' +
    '<button class="' + (state.theme==='light'?'active':'') + '" onclick="setTheme(\'light\')">' + icon('sun',14) + '<span>Light</span></button>' +
    '<button class="' + (state.theme==='dark'?'active':'') + '" onclick="setTheme(\'dark\')">' + icon('moon',14) + '<span>Dark</span></button>' +
    '</div></div>';
  html += '<div class="section-block"><h4>Settings</h4>' +
    '<div class="settings-row"><span>Location</span><span class="r">Fuzzed ~200m</span></div>' +
    '<div class="settings-row"><span>Push notifications</span><span class="r">On</span></div>' +
    '<div class="settings-row"><span>Saved posts</span><span class="r">' + state.events.filter(function(e){return e.saved;}).length + '</span></div>' +
    '<div class="settings-row"><span>Blocked accounts</span><span class="r">0</span></div></div>';
  html += '</div>';
  return html;
}

function renderBottomNav(){
  return (
    '<div class="bottomnav">' +
      '<button class="nav-btn ' + (state.screen==='radius'?'active':'') + '" onclick="switchScreen(\'radius\')">' + icon('target',20) + '<span>Radius</span></button>' +
      '<button class="nav-btn ' + (state.screen==='chats'?'active':'') + '" onclick="switchScreen(\'chats\')">' + icon('message',20) + '<span>Chats</span></button>' +
      '<button class="nav-btn ' + (state.screen==='profile'?'active':'') + '" onclick="switchScreen(\'profile\')">' + icon('user',20) + '<span>Profile</span></button>' +
      '<button class="nav-btn" onclick="switchScreen(\'create\')"><span class="nav-fab">' + icon('plus',20) + '</span></button>' +
    '</div>'
  );
}

initTheme();
render();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
